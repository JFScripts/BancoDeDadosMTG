<style>
    .menu-container {
        position: relative; 
        display: flex;
        flex-direction: column;
        align-items: flex-end; 
        z-index: 999;
    }

    .botao-recolher {
        background-color: #ff9900;
        color: #000;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: filter 0.2s;
    }
    .botao-recolher:hover {
        filter: brightness(1.2);
    }

    .menu-lateral {
        position: absolute;
        top: 50px; 
        right: 0;
        background-color: #1a1a1a;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #333;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 200px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        transform-origin: top right;
        opacity: 1;
        transform: scale(1);
    }

    .menu-lateral.recolhido {
        opacity: 0;
        transform: scale(0); 
        pointer-events: none; 
    }

    .botao-menu {
        color: #ffffff;
        text-decoration: none;
        padding: 10px 15px;
        background-color: #2a2a2a;
        border-radius: 5px;
        font-weight: bold;
        transition: background-color 0.2s, color 0.2s;
    }
    .botao-menu:hover {
        background-color: #ff9900;
        color: #000000;
    }
</style>

<div class="menu-container">
    <button id="btn-toggle-menu" class="botao-recolher">
        ☰ Menu
    </button>
    
    <div id="corpo-do-menu" class="menu-lateral recolhido">
        <a href="/" class="botao-menu">Ver Inventário</a>
        <a href="/adicionar" class="botao-menu">Adicionar Carta</a>
        <a href="/colecao" class="botao-menu">Verificar Colecao</a>
        <a href="/configuracoes" class="botao-menu">⚙️ Configurações</a>
    </div>
</div>
