<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/toast.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; 
            color: #ffffff;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .radio-acabamento input {
            display: none;
        }
        .icone-filtro {
            width: 35px;
            height: 35px;
            cursor: pointer;
            transition: transform 0.2s;
            filter: drop-shadow(1px 1px 0px #ff9900) drop-shadow(-1px -1px 0px #ff9900) drop-shadow(1px -1px 0px #ff9900) drop-shadow(-1px 1px 0px #ff9900);
        }
        .radio-acabamento.desativado {
            opacity: 0.2;
            pointer-events: none; 
            filter: grayscale(100%);
        }
        .radio-acabamento input:checked + img {
            transform: scale(1.3);
            filter: drop-shadow(0px 0px 8px #ff9900); 
        }
        .carta-wrapper {
            perspective: 1000px;
            display: inline-flex; 
            margin-bottom: 20px; 
        }
        .carta-inner {
            position: relative;
            width: 400px;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .carta-face {
            width: 100%;
            backface-visibility: hidden; 
            -webkit-backface-visibility: hidden; 
            border-radius: 4.8%;
            border: 3px solid #ff9900; 
            overflow: hidden; 
            background-color: #121212;
        }
        .carta-frente {
            position: relative; 
            z-index: 2;
        }
        .carta-costas {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            transform: rotateY(180deg);
            z-index: 1;
        }
        .carta-face img {
            width: 100%;
            display: block;
        }
        .carta-inner.girar-360 {
            transform: rotateY(360deg);
        }
        #preview {
            display: block;  
            margin-bottom: 0 !important;
            position: relative;
            z-index: 1; 
        }
        #preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            mix-blend-mode: soft-light; 
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2; 
        }
        .efeito-foil #preview-overlay {
            opacity: 0.8;
            background: linear-gradient(
                110deg,
                rgba(255, 255, 255, 0) 10%,
                rgba(255, 255, 255, 0.4) 40%,
                rgba(255, 255, 255, 0.9) 50%,
                rgba(255, 255, 255, 0.4) 60%,
                rgba(255, 255, 255, 0) 90%
            );
        }
        .efeito-etched #preview-overlay {
            opacity: 0.6;
            background: repeating-linear-gradient(
                110deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0) 10%,
                rgba(255, 255, 255, 0.5) 15%,
                rgba(255, 255, 255, 0) 20%
            );
        }
        .item-historico {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #1e1e1e;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
        }
        .item-historico:hover {
            background-color: #333;
            border-left: 3px solid #ff9900;
        }
        .icone-mini {
            width: 20px;
            height: 20px;
            filter: drop-shadow(1px 1px 0px #ff9900) drop-shadow(-1px -1px 0px #ff9900) drop-shadow(1px -1px 0px #ff9900) drop-shadow(-1px 1px 0px #ff9900);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="carta-wrapper" id="wrapper-da-carta">
            <div class="carta-inner" id="inner-da-carta">
                <div class="carta-face carta-frente">  
                    <img id="preview" src="/static/verso.jpg" alt="frente">
                    <div id="preview-overlay"></div>
                </div>
                <div class="carta-face carta-costas">
                    <img src="/static/verso.jpg" alt="costas">
                </div>
            </div>
        </div>
        <div>
            <form>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="text" id="nomeCarta" placeholder="Nome da Carta" style="flex-grow: 1;">
                    <a id="link-ligamagic" href="#" target="_blank" title="Ver Preços na LigaMagic" style="display: none;">
                        <img src="/static/LigaMagicLogo.jpg" alt="LigaMagic" style="height: 25px;">
                    </a>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="edicaoCarta" style="flex-grow: 1; padding: 5px;">
                        <option value="" title="Aguardando Digitar o Nome da Carta">Digite o Nome da Carta</option>
                    </select>
                    <img id="simboloEdicao" src="" alt="simbolo" style="width: 30px; height: 30px; display: none; filter: drop-shadow(1px 1px 0px #ff9900) drop-shadow(-1px -1px 0px #ff9900) drop-shadow(1px -1px 0px #ff9900) drop-shadow(-1px 1px 0px #ff9900);">
                    <a id="link-edhrec" href="#" target="_blank" title="Ver Sinergias no EDHREC" style="display: none;">
                        <img src="/static/edhreclogo.png" alt="EDHREC" style="height: 25px;">
                    </a>
                </div>
                <div id="containerAcabamentos" style="display: flex; gap: 20px; margin-top: 10px;">
                    <label class="radio-acabamento" id="label_nonfoil">
                        <input type="radio" name="acabamento" value="nonfoil" id="radio_nonfoil" checked>
                        <img src="/static/nonfoil.png" title="Normal" class="icone-filtro">
                    </label>
                
                    <label class="radio-acabamento" id="label_foil">
                        <input type="radio" name="acabamento" value="foil" id="radio_foil">
                        <img src="/static/foil.png" title="Foil" class="icone-filtro">
                    </label>
                
                    <label class="radio-acabamento" id="label_etched">
                        <input type="radio" name="acabamento" value="etched" id="radio_etched">
                        <img src="/static/etched.png" title="Etched" class="icone-filtro">
                    </label>
                </div>
                <input type="number" id="qnt" placeholder="Quantidade">
                <input type="password" id="senha" placeholder="Senha">
                <button type="submit">Adicionar</button>
                <div id="area-historico" style="margin-top: 20px; border-top: 1px solid #333; padding-top: 10px;">
                    <h4 style="margin: 0 0 10px 0; color: #ff9900;">Últimas Adicionadas</h4>
                    <div id="lista-historico" style="max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;"></div>
                    <button type="button" id="btn-limpar" style="margin-top: 15px; width: 100%; padding: 10px; background-color: #ff9900; color: #000000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: filter 0.2s;">
                        Limpar Histórico
                    </button>
                </div>
            </form>
        </div>
        <div id="container-do-menu" style="position: fixed; top: 20px; right: 20px;"></div>
    </div>
    
    <script src="/static/toast.js"></script>
    <script>
        const inputNome = document.getElementById("nomeCarta")
        const imgPreview = document.getElementById("preview")
        const menuEdicoes = document.getElementById("edicaoCarta")
        const imgSimbolo = document.getElementById("simboloEdicao")
        const wrapper = document.getElementById("wrapper-da-carta")
        const innerCarta = document.getElementById("inner-da-carta")

        document.getElementById("btn-limpar").addEventListener("click", function() {
            document.getElementById("lista-historico").innerHTML = "";
        });

        function trocarCartaComFlip(novaUrl, infoAcabamentos, novaSigla, novoIcone){
            innerCarta.classList.add("girar-360");
            
            setTimeout(() => {
                imgPreview.src = novaUrl;
                
                if (novoIcone){
                    imgSimbolo.src = novoIcone;
                    imgSimbolo.style.display = "block";
                } else {
                    imgSimbolo.style.display = "none";
                }
                
                if (infoAcabamentos) {
                    atualizarOpcoesAcabamento(infoAcabamentos);
                } else {
                    resetarAcabamento();
                    document.querySelectorAll(".radio-acabamento").forEach(label => {
                        label.classList.add("desativado");
                        label.querySelector("input").disabled = true;
                    });
                }
            }, 300);

            setTimeout(() => {
                innerCarta.style.transition = "none"; 
                innerCarta.classList.remove("girar-360"); 
                
                setTimeout(() => {
                    innerCarta.style.transition = "transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)";
                }, 50);
            }, 600);
        }        

        function resetarAcabamento(){
            wrapper.classList.remove("efeito-foil", "efeito-etched")
            document.getElementById("radio_nonfoil").checked = true;
            document.querySelectorAll(".radio-acabamento").forEach(label => {
                label.classList.remove("desativado")
                label.querySelector("input").disabled = false
            })
        }

        function atualizarOpcoesAcabamento(listaAcabamentos){
            resetarAcabamento()
            const tipos = ["nonfoil", "foil", "etched"]
            tipos.forEach(tipo => {
                if (!listaAcabamentos.includes(tipo)){
                    const label = document.getElementById(`label_${tipo}`)
                    const radio = document.getElementById(`radio_${tipo}`)
                    label.classList.add("desativado")
                    radio.disabled = true
                    if (radio.checked){
                        document.getElementById("radio_nonfoil").checked = true
                    }
                }
            })
        }

        function buscarCarta(nomeDaCarta, siglaAlvo = null, acabamentoAlvo = null) {
            if (nomeDaCarta.length > 0) {
                fetch(`/buscar-foto?nome=${encodeURIComponent(nomeDaCarta)}`)
                .then(res => res.json())
                .then(dados => {
                    if (dados.urlImagem && dados.urlImagem !== "/static/inexistente.jpg") {
                        const linkLiga = document.getElementById("link-ligamagic");
                        const linkEDH = document.getElementById("link-edhrec");
                        
                        linkLiga.style.display = "block";
                        linkEDH.style.display = "block";
                        linkLiga.href = `https://www.ligamagic.com.br/?view=cartas/card&card=${encodeURIComponent(nomeDaCarta)}`;
                        
                        const nomeFormatadoEDH = nomeDaCarta.toLowerCase().replace(/ /g, "-").replace(/[^a-z0-9-]/g, "");
                        linkEDH.href = `https://edhrec.com/cards/${nomeFormatadoEDH}`;

                        window.dadosEdicoesAtuais = dados.edicoes;
                        menuEdicoes.innerHTML = "";

                        const idsScryfall = Object.keys(dados.edicoes);

                        if (idsScryfall.length > 0) {
                            idsScryfall.forEach(idUnico =>{
                                const info = dados.edicoes[idUnico];
                                const novaOpcao = document.createElement("option");
                                novaOpcao.value = idUnico;
                                novaOpcao.textContent = info.sigla.toUpperCase();
                                novaOpcao.title = info.nome;
                                novaOpcao.setAttribute("data-icon", info.icone);
                                menuEdicoes.appendChild(novaOpcao);
                            });

                            let idFinal = idsScryfall[0];
                            let infoFinal = dados.edicoes[idFinal];
                            
                            if (siglaAlvo) {
                                Array.from(menuEdicoes.options).forEach((opt, index) => {
                                    if (opt.textContent.toLowerCase() === siglaAlvo.toLowerCase()) {
                                        menuEdicoes.selectedIndex = index;
                                        idFinal = opt.value;
                                        infoFinal = dados.edicoes[idFinal];
                                    }
                                });
                            }

                            if (acabamentoAlvo) {
                                const radio = document.getElementById(`radio_${acabamentoAlvo}`);
                                if (radio) radio.checked = true;
                            }

                            trocarCartaComFlip(
                                infoFinal.imagemEdicao,
                                infoFinal.acabamentos,
                                infoFinal.sigla,
                                infoFinal.icone
                            );
                            
                            if (acabamentoAlvo) {
                                setTimeout(() => {
                                    wrapper.classList.remove("efeito-foil", "efeito-etched");
                                    if (acabamentoAlvo === "foil") wrapper.classList.add("efeito-foil");
                                    if (acabamentoAlvo === "etched") wrapper.classList.add("efeito-etched");
                                }, 350);
                            }

                        } else {
                            const opcaoVazia = document.createElement("option");
                            opcaoVazia.textContent = "Carta não encontrada";
                            menuEdicoes.appendChild(opcaoVazia);
                            trocarCartaComFlip("/static/inexistente.jpg", null, null, null);
                        }
                    } else {
                        menuEdicoes.innerHTML = "<option value=''>Carta não encontrada</option>";
                        trocarCartaComFlip("/static/inexistente.jpg", null, null, null);
                    }
                });
            }
        }

        inputNome.addEventListener("blur", function(){
            buscarCarta(inputNome.value.trim());
        });

        menuEdicoes.addEventListener("change", function(){
            const idSelecionado = menuEdicoes.value;
            const infoEdicao = window.dadosEdicoesAtuais[idSelecionado];
            trocarCartaComFlip(
                infoEdicao.imagemEdicao, 
                infoEdicao.acabamentos, 
                infoEdicao.sigla, 
                infoEdicao.icone
            );
        })

        document.querySelectorAll('input[name="acabamento"]').forEach(radio => {
            radio.addEventListener('change', function(){
                wrapper.classList.remove("efeito-foil", "efeito-etched")
                if (this.value == "foil"){
                    wrapper.classList.add("efeito-foil")
                } else if (this.value == "etched") {
                    wrapper.classList.add("efeito-etched")
                }
            })
        })

        const formulario = document.querySelector("form")

        formulario.addEventListener("submit", function(evento){
            evento.preventDefault();
            const nomeCarta = document.getElementById('nomeCarta').value;
            const qntCarta = document.getElementById('qnt').value;
            const qntNum = parseInt(qntCarta);
            if (isNaN(qntNum) || qntNum <= 0){
                mostrarAviso("A quantidade de carta precisa ser pelo menos 1", "erro");
                return;
            }
            const siglaSelecionada = menuEdicoes.options[menuEdicoes.selectedIndex].textContent.toLowerCase();
            const idScryfallSelecionado = menuEdicoes.value;
            if (siglaSelecionada === "carta não encontrada" || !siglaSelecionada){
                mostrarAviso("Selecione uma Edição Valida antes de Adicionar!", "erro");
                return;
            }

            const acabamentoSelecionado = document.querySelector('input[name="acabamento"]:checked').value;
            const senhaDigitada = document.getElementById('senha').value;
            const pacote = {
                nome: nomeCarta,
                qnt: qntNum,
                senha: senhaDigitada,
                edicao: siglaSelecionada,
                acabamento: acabamentoSelecionado,
                idScryfall: idScryfallSelecionado
            };

            fetch("/adicionar", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(pacote)
            })
            .then(resposta => resposta.json())
            .then(dados => {
                if(dados.mensagem) mostrarAviso(dados.mensagem);
                const listaHistorico = document.getElementById("lista-historico");
                const novoItem = document.createElement("div");
                novoItem.className = "item-historico";

                const siglaNoMomento = menuEdicoes.options[menuEdicoes.selectedIndex]?.textContent.toLowerCase();
                const acabamentoNoMomento = document.querySelector('input[name="acabamento"]:checked')?.value;
                const iconeEdicaoAtual = imgSimbolo.src;
                const iconeAcabamentoAtual = document.querySelector('input[name="acabamento"]:checked').nextElementSibling.src;

                novoItem.innerHTML = `
                    <span style="color: #aaa; font-weight: bold;">${qntCarta}x</span>
                    <span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${nomeCarta}</span>
                    <img src="${iconeEdicaoAtual}" class="icone-mini">
                    <img src="${iconeAcabamentoAtual}" class="icone-mini">
                `;

                novoItem.addEventListener("click", function() {
                    document.getElementById('nomeCarta').value = nomeCarta;
                    document.getElementById('qnt').value = qntCarta; 
                    
                    if (siglaNoMomento && siglaNoMomento !== "carta não encontrada") {
                         buscarCarta(nomeCarta, siglaNoMomento, acabamentoNoMomento);
                    } else {
                         buscarCarta(nomeCarta);
                    }
                });

                listaHistorico.prepend(novoItem);
                document.getElementById('qnt').value = "";
            })
            .catch(erro => {
                mostrarAviso("Erro ao conectar com o servidor.", "erro");
            });
        });

        fetch("/static/menu.html") 
        .then(resposta => {
            if (!resposta.ok) {
                throw new Error("Arquivo do menu não encontrado.");
            }
            return resposta.text();
        })
        .then(html => {
            document.getElementById("container-do-menu").innerHTML = html;
            const btnMenu = document.getElementById("btn-toggle-menu");
            const corpoMenu = document.getElementById("corpo-do-menu");
            btnMenu.addEventListener("click", function() {
                corpoMenu.classList.toggle("recolhido");
            });
        })
        .catch(erro => {});
    </script>
</body>
</html>
